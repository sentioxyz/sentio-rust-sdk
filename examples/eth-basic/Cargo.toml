[package]
name = "eth-basic"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Multichain ERC20 transfer processor example using Sentio SDK"

[lib]
name = "eth_basic"
path = "src/lib.rs"

[[bin]]
name = "eth-basic"
path = "src/main.rs"

[dependencies]
sentio-sdk = { path = "../../sdk" }
alloy = { version = "1", default-features = false, features = ["essentials", "reqwest", "reqwest-rustls-tls"] }
anyhow = "1.0"
bigdecimal = "0.4"
num-bigint = "0.4"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
derive_builder = "0.20"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

[build-dependencies]
sentio-cli = { path = "../../cli" }
