# Token metadata, one row per (chain, address). The id is chainId-address, which
# already gives that pair a unique index.
type Token @entity {
  id: ID! # chainId-address
  chain: String! @index
  address: String! @index
  symbol: String! @index
  name: String!
  decimals: Int!
  transfers: [Transfer!]! @derivedFrom(field: "token")
}

# One row per ERC20 Transfer log.
type Transfer @entity(immutable: true) {
  id: ID! # chainId-txHash-logIndex
  chain: String! @index
  token: Token!
  tokenAddress: String! @index # denormalized so it can be filtered without a join
  from: String! @index
  to: String! @index
  value: BigDecimal! # scaled by decimals, falls back to raw when metadata is unavailable
  valueRaw: BigInt!
  blockNumber: Int!
  timestamp: Timestamp! @index
  txHash: String! @index
  logIndex: Int!
}
